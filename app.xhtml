<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>求职追踪器</title>
  <style type="text/css">
    body { margin: 0; padding: 0; font-family: 'Noto Sans SC', sans-serif; background: #F2F8F0; }
    #loading { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #5B9A6F; }
    #loading .spinner { width: 40px; height: 40px; border: 3px solid #C8DDD0; border-top-color: #5B9A6F; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 16px; color: #5A7A5C; }
    #loading .error { color: #E07A6D; display: none; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>正在加载求职追踪器...</p>
    <p class="error" id="err"></p>
  </div>
  <script type="text/javascript">
  // <![CDATA[
  (function() {
    var urls = [
      'https://cdn.jsdelivr.net/gh/lujunling1230/job-tracker-pm@main/index.html',
      'https://fastly.jsdelivr.net/gh/lujunling1230/job-tracker-pm@main/index.html',
      'https://testingcf.jsdelivr.net/gh/lujunling1230/job-tracker-pm@main/index.html'
    ];
    var idx = 0;

    function tryFetch() {
      if (idx >= urls.length) {
        document.getElementById('err').style.display = 'block';
        document.getElementById('err').textContent = '所有CDN节点均无法访问，请检查网络连接';
        document.querySelector('.spinner').style.display = 'none';
        return;
      }
      fetch(urls[idx])
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function(html) {
          var blob = new Blob([html], { type: 'text/html; charset=utf-8' });
          var url = URL.createObjectURL(blob);
          window.location.replace(url);
        })
        .catch(function(err) {
          idx++;
          tryFetch();
        });
    }

    tryFetch();
  })();
  // ]]>
  </script>
</body>
</html>
